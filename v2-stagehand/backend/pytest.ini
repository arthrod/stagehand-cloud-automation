[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-fail-under=85
    --asyncio-mode=auto
markers =
    asyncio: mark test as async
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

[coverage:run]
omit =
    tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
# Omit lines that can't be tested without the actual Stagehand library
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    from stagehand import
    import os
